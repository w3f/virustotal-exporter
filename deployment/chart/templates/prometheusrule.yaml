{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "virustotal-exporter.fullname" . }}
  labels:
    {{- include "virustotal-exporter.labels" . | nindent 4 }}
spec:
  groups:
    - name: virustotal-exporter
      rules:
        - alert: VirustotalDomainFlagged
          expr: max without (instance, pod) (last_over_time(virustotal_reports[1h])) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Domain {{ "{{ $labels.domain }}" }} is flagged on VirusTotal
            description: >-
              {{ "{{ $value }}" }} security vendors flag {{ "{{ $labels.domain }}" }} as malicious or suspicious:
              https://www.virustotal.com/gui/domain/{{ "{{ $labels.domain }}" }}
        - alert: VirustotalLookupStale
          expr: time() - max without (instance, pod) (last_over_time(virustotal_last_success_timestamp_seconds[1h])) > {{ mul 3 .Values.intervalMinutes 60 }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: VirusTotal lookups for {{ "{{ $labels.domain }}" }} are stale
            description: >-
              No successful VirusTotal lookup for {{ "{{ $labels.domain }}" }} for {{ "{{ $value | humanizeDuration }}" }};
              its reputation count can no longer be trusted
{{- end }}
